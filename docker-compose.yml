services:
  # ---------------------------------------------------------------------------
  # PostgreSQL + TimescaleDB
  # ---------------------------------------------------------------------------
  db:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-emis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-emis}
      POSTGRES_DB: ${POSTGRES_DB:-emis}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-emis} -d ${POSTGRES_DB:-emis}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Redis (rate limiting + Celery broker)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Flask API
  # ---------------------------------------------------------------------------
  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - path: backend/.env
        required: false
    environment:
      APP_ENV: production
      SECRET_KEY: ${SECRET_KEY:-change-me-before-production}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-before-production-too}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-emis}:${POSTGRES_PASSWORD:-emis}@db:5432/${POSTGRES_DB:-emis}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      RATELIMIT_STORAGE_URI: redis://redis:6379/1
      CORS_ORIGINS: http://localhost:5173
    volumes:
      - upload_data:/app/uploads
      - ./backend:/app
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/v1/system/health').read()"]
      interval: 15s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # Celery worker (no real tasks until Phase 3)
  # ---------------------------------------------------------------------------
  celery:
    build: ./backend
    restart: unless-stopped
    command: celery -A app.celery_app:celery worker --loglevel=info
    env_file:
      - path: backend/.env
        required: false
    environment:
      APP_ENV: production
      SECRET_KEY: ${SECRET_KEY:-change-me-before-production}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-before-production-too}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-emis}:${POSTGRES_PASSWORD:-emis}@db:5432/${POSTGRES_DB:-emis}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    volumes:
      - upload_data:/app/uploads
      - ./backend:/app
    depends_on:
      - backend
      - redis

  # ---------------------------------------------------------------------------
  # React frontend served by Nginx (also proxies /api to Flask)
  # ---------------------------------------------------------------------------
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  upload_data:
